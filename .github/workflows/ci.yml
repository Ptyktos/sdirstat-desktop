name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: fmt + clippy + build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - name: Install Tauri Linux system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev
      - name: Stage a sidecar for the build check
        # Tauri's build script validates the externalBin resource path exists even for a plain
        # `cargo build`/`check` -- not just at bundle time. Real released binary, not a stub, so
        # this exercises the same resource-resolution path a release build does.
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          mkdir -p binaries
          gh release download --repo Ptyktos/sdirstat \
            --pattern 'sdirstat-*-linux-x86_64' --output binaries/sdirstat-x86_64-unknown-linux-gnu
          chmod +x binaries/sdirstat-x86_64-unknown-linux-gnu
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: fmt
        run: cargo fmt --check
      - name: clippy
        run: cargo clippy --all-targets -- -D warnings
      - name: build
        run: cargo build --locked

# Public release pipeline. On a `v*` tag, each OS runner downloads the matching CLI binary from
# Ptyktos/sdirstat's latest release (or SDIRSTAT_VERSION if set), stages it as the Tauri sidecar,
# and builds the native installer.
#
# Split out of Ptyktos/sdirstat's desktop/ directory, where CI used to build the CLI and this app
# together in one job. That combined pipeline is gone; this repo now depends on sdirstat's
# releases as an external input instead of building it from source in the same job.
#
# NOT carried over from the original pipeline (real gaps, not oversights -- see README.md):
#   - code signing (Apple/Windows certs were never configured there either)
#   - winget / chocolatey publishing (those referenced this app's .msi from the combined pipeline)
name: release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      sdirstat_version:
        description: "sdirstat CLI version to bundle (without leading v; defaults to its latest release)"
        required: false

permissions:
  contents: read

jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - name: Install Tauri Linux system deps
        env:
          APPIMAGE_EXTRACT_AND_RUN: "1"
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev libfuse2
      - name: Download sdirstat CLI sidecar
        env:
          GH_TOKEN: ${{ github.token }}
          SDIRSTAT_VERSION: ${{ github.event.inputs.sdirstat_version }}
        run: |
          set -eu
          mkdir -p binaries
          if [ -n "${SDIRSTAT_VERSION:-}" ]; then
            gh release download "v${SDIRSTAT_VERSION}" --repo Ptyktos/sdirstat \
              --pattern 'sdirstat-*-linux-x86_64' --output binaries/sdirstat-x86_64-unknown-linux-gnu
          else
            gh release download --repo Ptyktos/sdirstat \
              --pattern 'sdirstat-*-linux-x86_64' --output binaries/sdirstat-x86_64-unknown-linux-gnu
          fi
          chmod +x binaries/sdirstat-x86_64-unknown-linux-gnu
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo install tauri-cli --version "^2" --locked
      - name: Build .deb + .AppImage
        run: |
          set -eu
          mkdir -p dist
          cargo tauri build --bundles deb
          cp target/release/bundle/deb/*.deb dist/
          if cargo tauri build --bundles appimage; then
            cp target/release/bundle/appimage/*.AppImage dist/
          else
            echo "::warning::AppImage bundling failed (linuxdeploy-plugin-gtk); shipping .deb only"
          fi
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with: { name: linux, path: dist/* }

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - name: Download sdirstat CLI sidecar
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          SDIRSTAT_VERSION: ${{ github.event.inputs.sdirstat_version }}
        run: |
          set -eu
          mkdir -p binaries
          if [ -n "${SDIRSTAT_VERSION:-}" ]; then
            gh release download "v${SDIRSTAT_VERSION}" --repo Ptyktos/sdirstat \
              --pattern 'sdirstat-*-windows-x86_64.exe' --output binaries/sdirstat-x86_64-pc-windows-msvc.exe
          else
            gh release download --repo Ptyktos/sdirstat \
              --pattern 'sdirstat-*-windows-x86_64.exe' --output binaries/sdirstat-x86_64-pc-windows-msvc.exe
          fi
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo install tauri-cli --version "^2" --locked
      - name: Build .msi + NSIS .exe
        shell: bash
        run: |
          set -eu
          mkdir -p dist
          cargo tauri build
          cp target/release/bundle/msi/*.msi  dist/ || echo "msi skipped"
          cp target/release/bundle/nsis/*.exe dist/ || echo "nsis skipped"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with: { name: windows, path: dist/* }

  # DISABLED: no Apple Developer certs configured (matches the original pipeline's state).
  # Also untested end-to-end even unsigned -- flip `if: false` off once exercised on a real
  # macOS runner.
  macos:
    if: false
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - name: Download sdirstat CLI sidecar
        env:
          GH_TOKEN: ${{ github.token }}
          SDIRSTAT_VERSION: ${{ github.event.inputs.sdirstat_version }}
        run: |
          set -eu
          mkdir -p binaries
          REF="${SDIRSTAT_VERSION:+v$SDIRSTAT_VERSION}"
          gh release download $REF --repo Ptyktos/sdirstat \
            --pattern 'sdirstat-*-macos-universal' --output binaries/sdirstat-universal-apple-darwin
          chmod +x binaries/sdirstat-universal-apple-darwin
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo install tauri-cli --version "^2" --locked
      - name: Build universal .dmg
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -eu
          [ -z "${APPLE_CERTIFICATE:-}" ] && unset APPLE_CERTIFICATE
          [ -z "${APPLE_CERTIFICATE_PASSWORD:-}" ] && unset APPLE_CERTIFICATE_PASSWORD
          [ -z "${APPLE_SIGNING_IDENTITY:-}" ] && unset APPLE_SIGNING_IDENTITY
          [ -z "${APPLE_ID:-}" ] && unset APPLE_ID
          [ -z "${APPLE_PASSWORD:-}" ] && unset APPLE_PASSWORD
          [ -z "${APPLE_TEAM_ID:-}" ] && unset APPLE_TEAM_ID
          mkdir -p dist
          cargo tauri build --target universal-apple-darwin --bundles dmg
          cp target/universal-apple-darwin/release/bundle/dmg/*.dmg dist/ || echo "dmg skipped"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with: { name: macos, path: dist/* }

  release:
    needs: [linux, windows] # macos dropped while its job is disabled (if: false above)
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: dist
          merge-multiple: true

      - name: Checksums (SHA256SUMS)
        run: ( cd dist && sha256sum * > SHA256SUMS )

      - name: SBOM (SPDX JSON, syft)
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0
        with:
          path: .
          format: spdx-json
          output-file: dist/sdirstat-desktop.spdx.json

      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Sign every artifact (cosign keyless)
        run: |
          set -eu
          cd dist
          for f in *; do
            case "$f" in *.cosign.bundle) continue;; esac
            cosign sign-blob --yes "$f" --bundle "$f.cosign.bundle"
          done

      - name: Attest build provenance (SLSA)
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: 'dist/*'

      - name: Cut or update the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          if gh release view "${GITHUB_REF_NAME}" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            gh release upload "${GITHUB_REF_NAME}" dist/* --repo "${GITHUB_REPOSITORY}" --clobber
          else
            gh release create "${GITHUB_REF_NAME}" dist/* \
              --repo "${GITHUB_REPOSITORY}" \
              --title "${GITHUB_REF_NAME}" \
              --generate-notes
          fi
